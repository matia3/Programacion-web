{% extends "productos/base.html" %}
{% block title %}Detalle de Producto - {{ producto.nombre }}{% endblock %}
{% block content %}
<div class="container mt-4 d-flex justify-content-center">
    <div class="custom-product-card p-4">
        <div class="row no-gutters">
            <div class="col-md-6">
                <img src="{{ producto.imagen.url }}" class="img-fluid rounded" alt="{{ producto.nombre }}">
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-center">
                <div class="card-body">
                    <h1 class="display-7">{{ producto.nombre }}</h1>
                    <p class="h3 text-success">${{ producto.precio }}</p>
                    <p class="h4 text-muted">Categoría: {{ producto.categoria }}</p>
                    <a href="{% url 'agregar_al_carrito' producto.id %}" class="btn btn-coral">Añadir al carrito</a>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    .custom-product-card {
        max-width: 1000px;
        border-radius: 15px;
        background-color: rgb(216, 0, 143);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
</style>
{% endblock %}
