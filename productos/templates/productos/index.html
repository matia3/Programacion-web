{% extends "productos/base.html" %} {% block title %} {% endblock %}
{% block content %}
{%load static%}
<!-- Jumbotron -->
<div class="jumbotron pt-5">
    <div class="container">
        <b>
            <h1 class="titulo2 display-4 pt-4">Destacados</h1>
        </b>
    </div>
</div>

<!-- Carrusel -->
<div id="myCarousel" class="carousel slide" data-bs-ride="carousel" data-bs-interval="3000">
    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="{% static 'img/pcesc.png' %}" class="d-block w-100" alt="Image 1">
        </div>
        <div class="carousel-item">
            <img src="{% static 'img/pcesc2.png' %}" class="d-block w-100" alt="Image 2">
        </div>
        <div class="carousel-item">
            <img src="{% static 'img/pcesc3.png' %}" class="d-block w-100" alt="Image 3">
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#myCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#myCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden">Next</span>
    </button>
</div>



<!-- Jumbotron -->
<div class="jumbotron">
    <div class="container">
        <b>
            <h1 class="titulo2 display-6 pt-2">Productos</h1>
        </b>
    </div>
</div>

<div class="container">
    <div class="row">
        <!-- Tarjeta 1 -->
        {% for producto in productos %}
        <div class="col-xxl-3 col-lg-4 col-md-6 col-sm-12 d-flex justify-content-center mb-3">
            <button class="card" role="button" tabindex="0">
               <a href="{% url 'detalle_producto' producto.id %}"> <img src="{{ producto.imagen.url }}" class="card-img-top" alt="Card image cap"></a>
                <div class="card-body">
                    <h5 class="card-title">{{ producto.nombre }}</h5>
                    <p class="card-text">${{ producto.precio }}</p>
                    {% if user.is_authenticated %}
                    <a href="{% url 'agregar_al_carrito' producto.id %}" class="btn btn-coral">Añadir al carrito</a>
                    {% endif %}
                </div>
            </button>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
